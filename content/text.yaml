# WORDING: the text on every screen, grouped by screen.
#
# Rules that keep this file working:
#   - Only change the text inside the "double quotes". Don't rename or remove the
#     names before the colons (like "title:"), because the screens look them up.
#   - Words in {curly brackets} are filled in by the app (for example {traveller} becomes
#     "Cathryn"). Keep them, but you can move them around in the sentence.
#   - **Two stars** around words make them bold.
#   - Lines starting with # are notes and are ignored by the app.
#
# SAMPLE (how one line looks):
#
#   title: "Where to?"     # "title" is the name the screen looks up; the text in quotes is shown.

