# PLACES: every place in the app, one entry per place.
#
# Rules that keep this file working:
#   - Each place starts with "- type:" at the very start of the line.
#   - The other lines of a place start with exactly two spaces.
#   - Put text in "double quotes". Dates look like 2026-11-22 (year-month-day).
#   - Leave out a line you don't need (the ones marked "optional").
#   - Lines starting with # are notes and are ignored by the app.
#
# SAMPLE PLACE (copy it, remove the # signs, then change the values):
#
# - type: friend-pick            # friend-pick = a friend's pick, shown in Explore.
#                                #   my-place = one of the traveller's own saved places.
#   name: "Amei Teahouse"        # English name.
#   name_zh: "阿妹茶樓"           # Optional. Chinese name.
#   stop: "Jiufen"               # A stop name from content/trip.yaml.
#   date: 2026-11-22             # Optional. The day of the trip it belongs to.
#   category: "Sight"            # A category from content/trip.yaml (Food, Sight, Nature, Trail, Shop, Stay).
#   recommended_by: "KuanJen"    # Who recommends it. Needed for friend-pick.
#   about_recommender: "Local · Taipei · friend of Yit"   # Optional. One short line about them.
#   why: "My favourite teahouse on the hill."             # Optional. "Why I love it".
#   what: "Get the oolong set and sit by the window."     # Optional. "What to order or do".
#   when: "Just before dusk on a weekday."                # Optional. "Best time to go".
#   translated_from: "Mandarin"  # Optional. Shows "Translated from Mandarin".
#   photo: "jiufen-amei-teahouse.jpg"   # Optional. A file name from content/photos.
#   google_maps: "https://maps.app.goo.gl/abc123"   # Optional. Used by the Directions button.
#   latitude: 25.1092            # Optional. Map position, used for Directions when there's
#   longitude: 121.8445          #   no Google Maps link.

# ---------- Friends' picks (shown in Explore, under their stop) ----------

